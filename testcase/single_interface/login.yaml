- baseInfo:
    api_name: Login
    url: /api/v1/auth/login
    method: post
    header:
      Content-Type: application/x-www-form-urlencoded;charset=UTF-8
  testCase:
    - case_name: Login with valid credentials
      params:
        username: admin
        password: admin123
      validation:
        - contains: {status_code: 200}
        - eq: {error_code: "0000"}
      extract:
        token: $.token

    - case_name: Login with wrong password
      params:
        username: admin
        password: wrongpassword
      validation:
        - contains: {status_code: 200}
        - eq: {error_code: "4001"}

    - case_name: Login with empty username
      params:
        username: ""
        password: admin123
      validation:
        - contains: {status_code: 200}
        - eq: {error_code: "4001"}

    - case_name: SQL injection input expects security-specific error code
      params:
        username: "' OR 1=1 --"
        password: any
      validation:
        - contains: {status_code: 200}
        - eq: {error_code: "9999"}