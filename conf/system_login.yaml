- baseInfo:
    api_name: Login
    url: /api/v1/auth/login
    method: post
    header:
      Content-Type: application/x-www-form-urlencoded;charset=UTF-8
  testCase:
    - case_name: Login with valid credentials
      params:
        username: admin
        password: admin123
      validation:
        - contains: {status_code: 200}
        - eq: {error_code: "0000"}
      extract:
        token: $.token