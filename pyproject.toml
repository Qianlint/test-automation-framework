[project]
name = "autotest-framework"
version = "0.1.0"
description = "Data-driven REST API test automation framework with pytest, Docker, CI, and Allure reporting deployed to GitHub Pages."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "allure-pytest>=2.16.0",
    "fastapi>=0.138.0",
    "jsonpath>=0.82.2",
    "pandas>=3.0.3",
    "paramiko>=5.0.0",
    "pymongo>=4.17.0",
    "pymysql>=1.2.0",
    "pyyaml>=6.0.3",
    "redis>=8.0.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.49.0",
]
